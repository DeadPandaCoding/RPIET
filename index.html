<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Valora — a private portfolio platform for rental property owners. Track income, expenses, occupancy, and performance with understated precision." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Valora — Private Portfolio</title>
    <script>
      // Apply the saved theme before the bundle loads to avoid a flash.
      // Mirrors src/lib/prefs.ts (pl.theme) + src/lib/theme.ts (dark class).
      // NOTE: if you change ANYTHING here (even whitespace or a comment), the
      // sha256 hash of this script in vercel.json's Content-Security-Policy
      // must be regenerated or the script will be blocked by the browser.
      ;(function () {
        try {
          var t = localStorage.getItem('pl.theme') || 'system'
          if (t === 'system') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          if (t === 'dark') document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
